# Global NGINX tuning included from /etc/nginx/conf.d via the default nginx.conf
# This file is included within the `http {}` context.

# Custom log format to show upstream address and hostnames
log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            'host: "$host" upstream_host: "$upstream_host_name" '
                            'upstream_addr: $upstream_addr';

# Fix: avoid "could not build server_names_hash" errors when using many/long hostnames
server_names_hash_bucket_size 128;
# Optionally raise the overall hash size to accommodate many names (safe default)
server_names_hash_max_size 4096;

# Fix: avoid "could not build map_hash" errors when using many/long hostnames or values
map_hash_bucket_size 128;
map_hash_max_size 4096;

